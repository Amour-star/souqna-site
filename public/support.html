<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Support – Souqna</title>
  <meta name="description" content="Contact Souqna support for account, policy, and technical help." />
  <style>
    :root { --brand:#008e91; --gray-50:#f8fafc; --gray-200:#e2e8f0; --gray-700:#334155; --white:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,sans-serif; background:var(--gray-50); color:#0f172a; }
    .wrap { max-width:680px; margin:0 auto; padding:24px 16px 48px; }
    .card { background:var(--white); border:1px solid var(--gray-200); border-radius:12px; padding:24px; }
    h1 { margin-top:0; color:var(--brand); }
    p { color:var(--gray-700); line-height:1.7; }
    a { color:var(--brand); }
  
    .site-header { background: var(--white, #fff); border-bottom: 1px solid var(--gray-200, #e2e8f0); }
    .site-header__inner { max-width: 900px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    .site-header__brand { font-weight: 700; font-size: 1.25rem; color: var(--brand, #008e91); text-decoration: none; }
    .site-header nav { display: flex; gap: 16px; flex-wrap: wrap; margin-inline-start: auto; }
    .site-header nav a { color: var(--gray-700, #334155); text-decoration: none; font-size: .95rem; }
    .site-header nav a:hover { color: var(--brand, #008e91); }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__brand" href="/">Souqna · سوقنا</a>
      <nav aria-label="Souqna">
        <a href="/">Home</a>
        <a href="/faq.html">FAQ</a>
        <a href="/safety.html">Safety</a>
        <a href="/support.html">Support</a>
        <a href="/privacy.html">Privacy</a>
        <a href="/terms.html">Terms</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <section class="card">
      <h1>Support – Souqna</h1>
      <p>Email: <a href="mailto:payment@souqna.net">payment@souqna.net</a></p>
      <p>We typically respond within 1–3 business days.</p>
      <p><a href="/index.html">← Back to homepage</a></p>
    </section>
  </main>
</body>
</html>
